
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="transferTitle transferDesc">
  <title id="transferTitle">From ab initio calculations to new nuclei</title>
  <desc id="transferDesc">Years of ab initio calculations across several nuclei train a symmetry-informed neural network through the sd shell, enabling predictions of nuclear structure beyond the training set.</desc>
